# Cloud Build pipeline: build and push the container image, then deploy it
# to Cloud Run with Terraform (remote state in a GCS bucket).
#
# Required trigger substitutions: _TF_STATE_BUCKET, _RUNTIME_SA.
# The image tag is the immutable commit SHA ($SHORT_SHA).

substitutions:
  _REGION: us-central1
  _AR_REPOSITORY: cloudbuild-demo
  _SERVICE_NAME: cloudbuild-demo
  _TF_STATE_BUCKET: ""
  _RUNTIME_SA: ""
  _ALLOW_UNAUTHENTICATED: "false"

steps:
  # Fail fast if required substitutions were not set on the trigger.
  - id: check-substitutions
    # Cloud Build expands ${_VAR}; "$$" escapes a literal "$" for the shell.
    name: bash
    entrypoint: bash
    args:
      - -c
      - |
        missing=0
        if [ -z "${_TF_STATE_BUCKET}" ]; then echo "ERROR: _TF_STATE_BUCKET is empty"; missing=1; fi
        if [ -z "${_RUNTIME_SA}" ]; then echo "ERROR: _RUNTIME_SA is empty"; missing=1; fi
        exit "$$missing"

  # Build the image, tagged with the commit SHA.
  - id: docker-build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA
      - .

  # Push explicitly: Terraform needs the image in Artifact Registry before deploying.
  - id: docker-push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA

  # Initialize Terraform with the GCS remote backend.
  - id: terraform-init
    name: hashicorp/terraform:1.13.5
    dir: terraform/service
    args:
      - init
      - -input=false
      - -backend-config=bucket=${_TF_STATE_BUCKET}
      - -backend-config=prefix=service

  # Create a saved plan for the new image.
  - id: terraform-plan
    name: hashicorp/terraform:1.13.5
    dir: terraform/service
    args:
      - plan
      - -input=false
      - -out=tfplan
      - -var=project_id=$PROJECT_ID
      - -var=region=${_REGION}
      - -var=service_name=${_SERVICE_NAME}
      - -var=image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA
      - -var=runtime_service_account_email=${_RUNTIME_SA}
      - -var=allow_unauthenticated=${_ALLOW_UNAUTHENTICATED}

  # Apply exactly the saved plan (no re-planning, no interactive approval).
  - id: terraform-apply
    name: hashicorp/terraform:1.13.5
    dir: terraform/service
    args:
      - apply
      - -input=false
      - tfplan

options:
  # Required when the trigger runs as a user-managed service account.
  logging: CLOUD_LOGGING_ONLY
