<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cloud Build + Terraform demo</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f5f7fa;
        color: #1f2933;
      }
      main { max-width: 36rem; padding: 2rem 1.5rem; text-align: center; }
      h1 { font-size: 1.75rem; margin: 0 0 0.75rem; }
      p { margin: 0; line-height: 1.5; color: #52606d; }
      @media (prefers-color-scheme: dark) {
        body { background: #111827; color: #f3f4f6; }
        p { color: #9ca3af; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Cloud Build + Terraform demo</h1>
      <p>This page was built and deployed to Cloud Run by a Cloud Build pipeline using Terraform.</p>
    </main>
  </body>
</html>
